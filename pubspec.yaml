name: ai_2_gopher
description: A cross-platform Gopher protocol client built with Flutter
publish_to: 'none'
version: 1.6.0+9

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # UI
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.1

  # Storage
  shared_preferences: ^2.2.2

  # URL parsing
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  generate: true
  uses-material-design: true

  # assets:
  #   - images/

  # fonts:
